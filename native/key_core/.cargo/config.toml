# curve25519-dalek's `fiat` backend on every target, the owner's decision O14
# of 28 October 2026: field arithmetic generated by fiat-crypto and proved in
# Coq, instead of `serial` (the phones) or `simd` (the x86_64 emulator).
#
# A `target.<cfg>` table, not `build.rustflags`: Cargo drops `build.rustflags`
# for a target that has flags of its own, and the build hook and the tool
# scripts give each target its linker flags (CARGO_TARGET_<TRIPLE>_RUSTFLAGS),
# which are joined with these. `RUSTFLAGS` replaces both — and then
# `src/lib.rs` refuses to compile, rather than fall back to another backend.
#
# Found from the working directory: the hook runs Cargo in this crate's, as
# rustup needs for rust-toolchain.toml.
[target.'cfg(all())']
rustflags = ['--cfg', 'curve25519_dalek_backend="fiat"']

# rustdoc reads its own flags, not the ones above; without the backend flag
# `cargo test`'s doctest pass (and `cargo doc`) meet `src/lib.rs`'s refusal.
[build]
rustdocflags = ['--cfg', 'curve25519_dalek_backend="fiat"']
