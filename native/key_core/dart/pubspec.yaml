name: key_core
description: >-
  The Dart side of the Smartable key core over dart:ffi: a phrase goes in once,
  a handle comes back, and keys are asked of the handle by path. Its build hook
  builds the Rust crate one directory up. Not wired into the app — Phase 1 of
  docs/RUST_KEY_CORE_DESIGN.md.
publish_to: 'none'
version: 0.0.0

environment:
  # Build hooks are stable from Dart 3.10.
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  # The build hook's protocol, at exactly the versions the app resolves.
  code_assets: 1.0.0
  # Native memory for the calls. Exact: it sits on the seed's path in.
  ffi: 2.2.0
  hooks: 1.0.3

dev_dependencies:
  # The oracle: what the wallet derives and signs with today, at exactly the
  # version the app resolves.
  blockchain_utils: 7.1.0
  lints: ^5.0.0
  test: ^1.24.0
