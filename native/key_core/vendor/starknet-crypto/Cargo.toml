[package]
edition = "2021"
name = "starknet-crypto"
version = "0.8.1"
authors = ["Jonathan LEI <me@xjonathan.dev>"]
build = false
exclude = ["test-data/**"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Low-level cryptography utilities for Starknet
"""
homepage = "https://starknet.rs/"
readme = "README.md"
keywords = [
    "ethereum",
    "starknet",
    "web3",
    "no_std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/xJonathanLEI/starknet-rs"

[features]
alloc = [
    "hex?/alloc",
    "starknet-types-core/alloc",
]
default = [
    "std",
    "signature-display",
]
pedersen_no_lookup = []
signature-display = [
    "dep:hex",
    "alloc",
]
std = ["starknet-types-core/std"]

[lib]
name = "starknet_crypto"
path = "src/lib.rs"

[dependencies.hex]
version = "0.4.3"
optional = true
default-features = false

[dependencies.num-bigint]
version = "0.4.3"
default-features = false

[dependencies.num-integer]
version = "0.1.45"
default-features = false

[dependencies.num-traits]
version = "0.2.18"
default-features = false

[dependencies.starknet-curve]
version = "0.6.0"

[dependencies.starknet-types-core]
version = "0.2.0"
features = [
    "curve",
    "hash",
]
default-features = false

[dev-dependencies.criterion]
version = "0.4.0"
default-features = false

[dev-dependencies.hex]
version = "0.4.3"

[dev-dependencies.hex-literal]
version = "0.4.1"

[dev-dependencies.serde]
version = "1.0.160"
features = ["derive"]

[dev-dependencies.serde_json]
version = "1.0.96"

[dev-dependencies.starknet-types-core]
version = "0.2.0"
features = [
    "alloc",
    "hash",
]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.wasm-bindgen-test]
version = "0.3.50"

